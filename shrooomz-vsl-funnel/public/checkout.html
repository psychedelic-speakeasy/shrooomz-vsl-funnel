<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout | Shrooomz</title>
<!-- Checkout for the package picked on the video page (?plan=1m, 3m or 6m). Stripe's card form (Payment Element):
     card details go straight to Stripe. The card is saved to the customer so upsells are one click. -->
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#f1f5f9; color:#0f172a; font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; line-height:1.45; }
  .wrap { max-width:560px; margin:0 auto; padding:18px 16px 40px; }
  .logo { text-align:center; margin-bottom:12px; }
  .steps { display:flex; justify-content:center; gap:10px; font-size:12px; font-weight:700; color:#64748b; margin-bottom:18px; }
  .steps span.on { color:#16a34a; }
  h1 { font-size:24px; font-weight:900; text-align:center; margin-bottom:16px; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 2px 8px rgba(15,23,42,.05); }
  .card h2 { font-size:13px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#475569; margin-bottom:12px; }
  .sum { display:flex; gap:14px; align-items:center; }
  .sum img { width:110px; height:90px; object-fit:contain; flex:none; }
  .sum .name { font-weight:800; font-size:17px; }
  .sum .sub { font-size:13px; color:#64748b; }
  .sum .change { font-size:12px; color:#2563eb; text-decoration:underline; }
  .lines { margin-top:14px; border-top:1px solid #e2e8f0; padding-top:10px; font-size:14px; }
  .lines div { display:flex; justify-content:space-between; padding:3px 0; }
  .lines s { color:#94a3b8; }
  .lines .save { color:#16a34a; font-weight:700; }
  .lines .tot { font-weight:900; font-size:18px; border-top:1px solid #e2e8f0; margin-top:6px; padding-top:8px; }
  label { display:block; font-size:13px; font-weight:700; margin:10px 0 4px; }
  input { width:100%; font-size:16px; padding:12px; border:1px solid #cbd5e1; border-radius:8px; background:#fff; }
  #pay { margin-top:12px; min-height:60px; }
  .err { color:#b91c1c; font-size:14px; margin-top:10px; min-height:18px; }
  .btn { display:block; width:100%; border:0; cursor:pointer; font-size:19px; font-weight:900; padding:16px; border-radius:10px; background:linear-gradient(#facc15,#eab308); color:#000; margin:6px 0 10px; }
  .btn[disabled] { opacity:.6; cursor:wait; }
  .trust { display:flex; flex-wrap:wrap; justify-content:center; gap:6px 16px; font-size:12px; color:#475569; }
  .demo { background:#0B1F3A; color:#fff; font-size:12px; text-align:center; padding:7px; }
</style>
</head>
<body data-page="checkout">
<div class="demo" id="demo" hidden>Demo mode: Stripe keys are not set, so no card is charged.</div>
<div class="wrap">
  <div class="logo"><svg aria-label="Shrooomz" role="img" width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M50 10C28 10 12 28 12 44C12 52 18 58 30 58H70C82 58 88 52 88 44C88 28 72 10 50 10Z" fill="#2B5EA7"></path><path d="M50 10C50 10 62 22 62 44H38C38 22 50 10 50 10Z" fill="rgba(255,255,255,0.15)"></path><circle cx="38" cy="32" r="5" fill="rgba(255,255,255,0.3)"></circle><rect x="42" y="58" width="16" height="32" rx="8" fill="#2B5EA7"></rect></svg></div>
  <div class="steps"><span class="on">1. Order</span><span>2. Customize</span><span>3. Complete</span></div>
  <h1>Complete Your Order</h1>

  <div class="card">
    <h2>Your order</h2>
    <div class="sum">
      <img id="img" src="" alt="">
      <div>
        <div class="name" id="name"></div>
        <div class="sub" id="sub"></div>
        <a class="change" id="change" href="/watch?reveal=1">Change package</a>
      </div>
    </div>
    <div class="lines">
      <div><span>Regular price</span><s id="reg"></s></div>
      <div class="save" id="saverow"><span>You save</span><span id="save"></span></div>
      <div><span>Shipping</span><span>[confirm]</span></div>
      <div class="tot"><span>Total today</span><span id="tot"></span></div>
    </div>
  </div>

  <form class="card" id="f">
    <h2>Your details</h2>
    <label for="email">Email</label>
    <input id="email" type="email" required autocomplete="email" placeholder="you@example.com">
    <label for="cname">Full name</label>
    <input id="cname" required autocomplete="name" placeholder="First and last name">
    <div id="pay"></div>
    <div class="err" id="err"></div>
  </form>

  <button class="btn" id="go" form="f" type="submit">Complete My Order</button>
  <div class="trust"><span>🔒 Secure checkout</span><span>📦 Discreet packaging [confirm]</span><span>✅ [X] day guarantee</span></div>
</div>
<script src="/js/settings.js"></script>
<script src="/js/funnel.js"></script>
<script src="https://js.stripe.com/v3/"></script>
<script>
  (function () {
    var PLANS = { "1m": ["1 Month Supply", "20 capsules", 99, 99, "/img/pkg-1m.png"],
                  "3m": ["3 Month Supply", "60 capsules", 199, 297, "/img/pkg-3m.png"],
                  "6m": ["6 Month Supply", "120 capsules", 297, 594, "/img/pkg-6m.png"] };
    var q = new URLSearchParams(location.search), key = PLANS[q.get("plan")] ? q.get("plan") : "3m", p = PLANS[key];
    var $ = function (id) { return document.getElementById(id); };
    $("img").src = p[4]; $("img").alt = p[0];
    $("name").textContent = "Secret Shrooomz " + p[0]; $("sub").textContent = p[1];
    $("reg").textContent = "$" + p[3]; $("save").textContent = "$" + (p[3] - p[2]);
    if (p[3] === p[2]) $("saverow").style.display = "none";
    $("tot").textContent = "$" + p[2]; $("email").value = q.get("email") || "";
    $("change").href = "/watch?reveal=1" + (q.get("email") ? "&email=" + encodeURIComponent(q.get("email")) : "");
    try { fbq("track", "InitiateCheckout", { value: p[2], currency: "USD" }); } catch (e) {}

    // 6-month buyers skip upsell 1 (it offers them what they just bought)
    var next = (key === "6m" ? "/upsell-2" : "/upsell-1");
    var back = new URL(next, location.origin); back.searchParams.set("plan", key);
    ["utm_source", "utm_medium", "utm_campaign", "utm_content", "campaign_id", "medium_id", "content_id"].forEach(function (k) {
      if (q.get(k)) back.searchParams.set(k, q.get(k)); });

    var stripe, elements, demo = true;
    fetch("/api/config").then(function (r) { return r.json(); }).then(function (cfg) {
      demo = cfg.demo;
      if (demo) { $("demo").hidden = false; $("pay").innerHTML = '<label>Card</label><input disabled placeholder="Card form appears here once Stripe keys are set">'; return; }
      stripe = Stripe(cfg.publishableKey);
      elements = stripe.elements({ mode: "payment", amount: p[2] * 100, currency: "usd", setupFutureUsage: "off_session",
                                   paymentMethodTypes: ["card"], appearance: { theme: "stripe" } });
      elements.create("payment", { layout: "tabs" }).mount("#pay");
    });

    $("f").addEventListener("submit", function (e) {
      e.preventDefault();
      var go = $("go"), err = $("err"); err.textContent = "";
      var fail = function (m) { err.textContent = m || "Something went wrong. Please try again."; go.disabled = false; go.textContent = "Complete My Order"; };
      go.disabled = true; go.textContent = "Processing...";
      if (demo) { back.searchParams.set("payment_intent", "demo"); return (location.href = back.pathname + back.search); }
      elements.submit().then(function (r) {
        if (r.error) throw r.error;
        return fetch("/api/checkout", { method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ plan: key, email: $("email").value, name: $("cname").value }) }).then(function (x) { return x.json(); });
      }).then(function (r) {
        if (!r.clientSecret) throw new Error(r.error);
        return stripe.confirmPayment({ elements: elements, clientSecret: r.clientSecret,
          confirmParams: { return_url: back.href, receipt_email: $("email").value,
                           payment_method_data: { billing_details: { email: $("email").value, name: $("cname").value } } } });
      }).then(function (r) { if (r && r.error) fail(r.error.message); })
        .catch(function (x) { fail(x && x.message); });
    });
  })();
</script>
</body>
</html>
